# /etc/systemd/system/lmcache-server.service.d/hybrid.conf
[Service]
ExecStart=
ExecStart=/opt/lmcache/.venv/bin/lmcache server --transport zmq --host 0.0.0.0 --port 5555 --l1-size-gb 40 --eviction-policy LRU --supported-transfer-mode engine_driven --chunk-size 784 --separate-object-groups --isolated-ipc --http-host 127.0.0.1 --http-port 8080 --disable-metrics --no-run-script-api-enabled
